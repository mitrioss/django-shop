{% load static %}
<header>
    <nav class="navbar navbar-expand-lg navbar-light shadow">
        <div class="container d-flex justify-content-between align-items-center">

            <a class="navbar-brand text-success logo h1 align-self-center" href="{% url 'shop:index' %}">
                NeBuket
            </a>

            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse"
                    data-bs-target="#templatemo_main_nav" aria-controls="navbarSupportedContent" aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="align-self-center collapse navbar-collapse flex-fill  d-lg-flex justify-content-lg-between"
                 id="templatemo_main_nav">
                <div class="flex-fill">
                    <ul class="nav navbar-nav d-flex justify-content-between mx-lg-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'shop:index' %}">Главная</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'shop:product_list' %}">Католог</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'pages:about' %}">О нас</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'pages:contact' %}">Контакты</a>
                        </li>
                    </ul>
                </div>
                <div class="navbar align-self-center d-flex">
                    <a class="nav-icon position-relative text-decoration-none" href="{% url 'cart:cart_detail' %}">
                        <i class="fa fa-fw fa-cart-arrow-down text-dark mr-1"></i>
                        <span class="position-absolute top-0 left-100 translate-middle badge rounded-pill bg-light text-dark">{{ cart.get_total_price }}</span>
                    </a>
                    {% if user.is_authenticated %}
                    <a class="nav-icon position-relative text-decoration-none" href="{% url 'user:profile' %}">
                        {{ user.username }}
                    </a>
                    <form action="{% url 'logout' %}" method="post">
                        {% csrf_token %}
                        <button class='button1' type="submit">Выход</button>
                    </form>
                    {% else %}
                    <div class="btn2">
                        <a class='button2' href="{% url 'login' %}" style="padding-right: 20px">Авторизация</a>
                    </div>
                    <div class="btn3">
                        <a class='button3' href="{% url 'user:signup' %}">Регистрация</a>
                    </div>
                    {% endif %}
                </div>
            </div>

        </div>
    </nav>
</header>
