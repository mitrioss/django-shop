{% extends "base.html" %}
{% load static %}

{% block title %}
Регистрация
{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row text-center">
        <div class="col-lg-6 m-auto">
            <h1 class="h1">Регистрация</h1>
            <p>
                Создайте аккаунт, чтобы пользоваться всеми возможностями нашего магазина!
            </p>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-6 m-auto">
            <form method="post">
                {% csrf_token %}
                <div class="form-group mb-3">
                    <label for="{{ form.username.id_for_label }}" class="form-label">Логин:</label>
                    <input type="text" name="username" id="{{ form.username.id_for_label }}"
                           class="form-control" placeholder="Введите логин">
                </div>
                <div class="form-group mb-3">
                    <label for="{{ form.password1.id_for_label }}" class="form-label">Пароль:</label>
                    <input type="password" name="password1" id="{{ form.password1.id_for_label }}"
                           class="form-control" placeholder="Введите пароль">
                </div>
                <div class="form-group mb-3">
                    <label for="{{ form.password2.id_for_label }}" class="form-label">Повторите пароль:</label>
                    <input type="password" name="password2" id="{{ form.password2.id_for_label }}"
                           class="form-control" placeholder="Повторите пароль">
                </div>
                <div class="d-flex justify-content-between">
                    <button type="submit" class="btn btn-success btn-lg w-50 ms-1">Продолжить</button>
                    <a href="{% url 'shop:index' %}" class="btn btn-secondary btn-lg w-50 ms-1">Вернуться назад</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
